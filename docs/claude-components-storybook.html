  <style>
    /* ==========================================================================
       Claude Design System (CDS) Production Design Tokens & Keyframes
       Claude Desktop 2.42304.0.0 (MSIX ion-dist) & claude.ai web build 541957a01b
       ========================================================================== */

    :root {
      --cds-surface-0: #f9f9f7;
      --cds-surface-1: #fcfcfb;
      --cds-surface-2: #ffffff;
      --cds-surface-3: #ffffff;
      --cds-surface-popover: #ffffff;
      --cds-clay: #d97757;
      --cds-clay-hover: #cc5a36;

      /* Claude Official Alpha & Border Hierarchy（claude.ai 实测：基色 #0b0b0b = rgb 11） */
      --cds-alpha-0: rgb(11 11 11 / 0%);
      --cds-alpha-1: rgb(11 11 11 / 5%); /* Ghost hover, skeleton, disabled */
      --cds-alpha-2: rgb(11 11 11 / 10%); /* Standard border, secondary fill */
      --cds-alpha-3: rgb(11 11 11 / 20%); /* Border strong, control hover */
      --cds-alpha-4: rgb(11 11 11 / 35%); /* Heavy divider（border-stronger 实测另为 40%） */

      --cds-border: var(--cds-alpha-2);
      --cds-border-strong: var(--cds-alpha-3);
      --cds-ring-hairline: 1px;

      /* Claude Dual-Ring Architecture (Light Mode: 1px outer ring + diffuse shadow) */
      --cds-ring-inner: 0px;
      --cds-ring-outer: 1px;
      --cds-ring-color: var(--cds-border);

      /* Claude Official Elevation Shadow Hierarchy（claude.ai 实测：基色 rgb 11，近层 6 / 7 / 8%，远层 = --cds-shadow-color） */
      --cds-shadow-color: rgb(11 11 11 / 8%);
      --cds-shadow-sm: 0 1px 2px 0 rgb(11 11 11 / 6%), 0 2px 8px 0 var(--cds-shadow-color);
      --cds-shadow-md: 0 2px 4px 0 rgb(11 11 11 / 7%), 0 6px 16px 0 var(--cds-shadow-color);
      --cds-shadow-lg: 0 4px 8px 0 rgb(11 11 11 / 8%), 0 12px 28px -2px var(--cds-shadow-color);
      --cds-shadow-popover: inset 0 0 0 var(--cds-ring-inner) var(--cds-ring-color), 
                            0 0 0 var(--cds-ring-outer) var(--cds-ring-color), 
                            0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);

      --cds-panel-shadow: 0 0 0 1px var(--cds-border), var(--cds-shadow-sm);
      --cds-panel-shadow-hover: 0 0 0 1px var(--cds-border-strong), 0 4px 16px -2px rgba(0, 0, 0, 0.09);

      /* Claude Official Chat Composer Shadow Formula */
      --cds-shadow-composer: 0 4px 20px rgba(0, 0, 0, 0.035), inset 0 0 0 1px var(--cds-border);
      --cds-shadow-composer-hover: 0 4px 24px rgba(0, 0, 0, 0.06), inset 0 0 0 1px var(--cds-border-strong);
      --cds-shadow-composer-focus: 0 4px 24px rgba(0, 0, 0, 0.08), inset 0 0 0 1px var(--cds-border-strong), 0 0 0 1px var(--cds-border-strong);

      /* Triple-Layer Focus Ring & Drop Glow（焦点环是 accent 蓝，claude.ai 实测） */
      --cds-fill-accent: #2a78d6;
      --cds-bg-accent: #cde2fb;
      --cds-focus-shadow: inset 0 0 0 1px var(--cds-surface-1), 0 0 0 1px var(--cds-fill-accent), 0 0 6px 1px var(--cds-bg-accent);
      --cds-shadow-drop-glow: inset 0 0 24px -2px rgba(217, 119, 87, 0.20), inset 0 0 0 2px var(--cds-clay);

      /* Interactive Hover / Fill Tokens */
      --cds-fill-ghost-hover: var(--cds-alpha-1);
      --cds-fill-ghost-selected: var(--cds-alpha-2);
      --cds-fill-secondary: #ffffff1a; /* claude.ai 实测：再叠 inset 1px --cds-fill-secondary-ring + 0 1px 2px #0000000d */
      --cds-fill-secondary-hover: var(--cds-alpha-1);
      --cds-fill-secondary-ring: var(--cds-alpha-2);
      /* 主按钮用中性黑白；陶土只给发送键（--cds-fill-brand）和 Spark */
      --cds-fill-primary: #0b0b0b;
      --cds-fill-primary-hover: #2c2c2a;
      --cds-on-primary: #ffffff;

      --cds-text-primary: #0b0b0b;
      --cds-text-secondary: #52514e;
      --cds-text-muted: #898781;
      --cds-segmented-track: var(--cds-alpha-1);
      --cds-segmented-thumb: #ffffff;

      /* Claude Official Radius Hierarchy (Exact Extracted Tokens) */
      --radius-xs: 2px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --cds-panel-radius: .75rem;
      --radius-xl: 12px;
      --radius-2xl: 16px;
      --cds-message-bubble-radius: 12px; /* = 控件 8 + 4 */
      --cds-radius-composer: .875rem; /* comfortable 14px；compact 密度 .75rem = 12px */
      --cmp-chin-touch-grow: 4px;
      --cds-surface-canvas: #fcfcfb;
      --df-radius-pill: 8px; /* 侧栏行圆角：comfortable 8px（compact 6px），名为 pill 实为圆角矩形 */
    }

    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 2dppx), (resolution >= 2x) {

    @media (-webkit-min-device-pixel-ratio: 3), (min-resolution: 3dppx), (resolution >= 3x) {

    .dark {
      --cds-surface-0: #0b0b0b;
      --cds-surface-1: #151515;
      --cds-surface-canvas: #151515;
      --cds-surface-2: #1a1a19;
      --cds-surface-3: #20201f;
      --cds-surface-popover: #222220;
      --cds-clay: #d97757;
      --cds-clay-hover: #e08264;

      /* Claude Official Alpha & Border Hierarchy (Dark Mode)（实测：#fff 同比例） */
      --cds-alpha-0: rgb(255 255 255 / 0%);
      --cds-alpha-1: rgb(255 255 255 / 5%); /* Ghost hover, disabled */
      --cds-alpha-2: rgb(255 255 255 / 10%); /* Standard border */
      --cds-alpha-3: rgb(255 255 255 / 20%); /* Border strong */
      --cds-alpha-4: rgb(255 255 255 / 35%); /* Heavy border */

      --cds-border: var(--cds-alpha-2);
      --cds-border-strong: var(--cds-alpha-3);

      /* Claude Dual-Ring Architecture (Dark Mode: 1px inner rim highlight + 0px outer ring) */
      --cds-ring-inner: 1px;
      --cds-ring-outer: 0px;
      --cds-ring-color: rgba(255, 255, 255, 0.10);

      /* Claude Official Elevation Shadow Hierarchy (Dark Mode)（claude.ai 实测：只换远层颜色，sm / md / lg 沿用 :root 公式；.dark 挂在 <html> 上） */
      --cds-shadow-color: #0000003d;
      --cds-shadow-popover: 0 0 0 1px var(--cds-border),
                            0 8px 24px #00000052, 0 2px 6px #0003; /* claude.ai 实测：.wa-menu 两种主题都是 1px 外环 */

      --cds-panel-shadow: 0 0 0 1px var(--cds-border), var(--cds-shadow-sm);
      --cds-panel-shadow-hover: 0 0 0 1px var(--cds-border-strong), 0 6px 20px rgba(0, 0, 0, 0.6);

      --cds-shadow-composer: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 0 0 1px var(--cds-border);
      --cds-shadow-composer-hover: 0 4px 24px rgba(0, 0, 0, 0.55), inset 0 0 0 1px var(--cds-border-strong);
      --cds-shadow-composer-focus: 0 4px 24px rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255, 255, 255, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.22);

      --cds-focus-shadow: inset 0 0 0 1px var(--cds-surface-1), 0 0 0 1px var(--cds-fill-accent), 0 0 6px 1px rgb(24 79 149 / 60%);
      --cds-shadow-drop-glow: inset 0 0 24px -2px rgba(217, 119, 87, 0.30), inset 0 0 0 2px var(--cds-clay);

      --cds-fill-ghost-hover: var(--cds-alpha-1);
      --cds-fill-ghost-selected: var(--cds-alpha-2);
      --cds-fill-secondary: var(--cds-alpha-2);
      --cds-fill-secondary-hover: rgba(255, 255, 255, 0.14);
      --cds-fill-secondary-ring: transparent; /* 深色无环（claude.ai 实测） */
      --cds-fill-primary: #ffffff;
      --cds-fill-primary-hover: #e1e0d9;
      --cds-on-primary: #0b0b0b;

      --cds-text-primary: #f0efec;
      --cds-text-secondary: #c3c2b7;
      --cds-text-muted: #898781;
      --cds-segmented-track: #111;
      --cds-segmented-thumb: var(--cds-alpha-2);
    }

    /* CDS Elevation & Hover Utility Classes */
    .cds-shadow-sm { box-shadow: var(--cds-shadow-sm) !important; }
    .cds-shadow-md { box-shadow: var(--cds-shadow-md) !important; }
    .cds-shadow-lg { box-shadow: var(--cds-shadow-lg) !important; }
    .cds-shadow-popover { box-shadow: var(--cds-shadow-popover) !important; }
    .cds-panel-shadow { box-shadow: var(--cds-panel-shadow) !important; }
    
    .cds-composer-shadow { 
      box-shadow: var(--cds-shadow-composer) !important;
      transition: box-shadow 220ms cubic-bezier(0.16, 1, 0.3, 1), border-color 220ms ease;
    }
    .cds-composer-shadow:hover { 
      box-shadow: var(--cds-shadow-composer-hover) !important; 
    }
    .cds-composer-shadow:focus-within { 
      box-shadow: var(--cds-shadow-composer-focus) !important; 
    }

    /* 按压反馈（claude.ai 实测）：只缩放背景层 span.cds-btn-squish，文字与图标不动；
       按下 60ms ease-out 缩到 .975，松开 450ms --cds-btn-spring 回弹。按钮本身需 relative + isolate */
    .cds-btn-squish {
      position: absolute; inset: 0; z-index: -1; border-radius: inherit; transform-origin: 50% center;
      transition: transform var(--cds-dur-slow) var(--cds-btn-spring), background-color var(--cds-dur-fast) ease-out;
    }
    :not(:disabled):active > .cds-btn-squish {
      transform: scale(.975);
      transition: transform var(--cds-dur-fast) ease-out, background-color var(--cds-dur-fast) ease-out;
    }

    /* Ghost：::before 充当背景层，按压同样只缩放它 */
    .cds-hover-ghost {
      position: relative;
      isolation: isolate;
      transition: color 150ms ease;
    }
    .cds-hover-ghost::before {
      content: "";
      position: absolute; inset: 0; z-index: -1; border-radius: inherit; transform-origin: 50% center;
      transition: transform var(--cds-dur-slow) var(--cds-btn-spring), background-color 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cds-hover-ghost:hover {
      color: var(--cds-text-primary) !important;
    }
    .cds-hover-ghost:hover::before {
      background-color: var(--cds-fill-ghost-hover);
    }
    .cds-hover-ghost:active::before {
      background-color: var(--cds-fill-ghost-selected);
      transform: scale(.975);
      transition: transform var(--cds-dur-fast) ease-out, background-color var(--cds-dur-fast) ease-out;
    }

    .cds-card-interactive {
      box-shadow: var(--cds-panel-shadow);
      transition: box-shadow 200ms cubic-bezier(0.16, 1, 0.3, 1), transform 200ms cubic-bezier(0.16, 1, 0.3, 1), border-color 200ms ease;
    }
    .cds-card-interactive:hover {
      box-shadow: var(--cds-panel-shadow-hover) !important;
      transform: translateY(-1.5px);
      border-color: var(--cds-border-strong) !important;
    }
    .cds-card-interactive:active {
      transform: translateY(0);
    }

    .border-hairline {
      border-width: var(--cds-ring-hairline);
    }

    /* 1. 暗色模式光学减薄补偿 (Irradiation Compensation) */
    .dark .font-medium, .dark [data-optical-compensate] {
      font-variation-settings: "wght" 465;
    }
    .dark .font-semibold {
      font-variation-settings: "wght" 560;
    }
    .dark .font-bold {
      font-variation-settings: "wght" 660;
    }

    /* 2. 行内图标光学负偏置 */
    .align-neg-125 { vertical-align: -0.125em; }
    .align-neg-075 { vertical-align: -0.075em; }
    .align-neg-1px  { vertical-align: -1px; }

    /* 3. 文本换行约束 */
    .text-balance-native { text-wrap: balance; }
    .text-pretty-native  { text-wrap: pretty; }
    .overflow-wrap-anywhere { overflow-wrap: anywhere; word-break: normal; }

    /* 4. 等宽数字约束 */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }

    /* 5. 核心关键帧动画 (真实提取) */
    @keyframes _grapheme-reveal_1plog_1 {
      0%   { opacity: 0; filter: blur(6px); }
      100% { opacity: 1; filter: blur(0); }
    }

    @keyframes timeline-quiet-dot {

    @keyframes saved-check-decay {

    }

    @keyframes cds-skeleton-sweep {

    }

    @keyframes dframe-clay-breathe {

    /* 骨架屏扫光条 */
    .skeleton-shimmer {
      position: relative;
      overflow: hidden;
      background-color: rgba(0, 0, 0, 0.05);
    }
    .dark .skeleton-shimmer {

    .skeleton-shimmer::after {
      content: "";

    .xray-active [class*="border"]:not([class*="border-b"]):not([class*="border-t"]):not([class*="border-l"]):not([class*="border-r"]):not([class*="border-0"]) [class*="border"]:not([class*="border-b"]):not([class*="border-t"]):not([class*="border-l"]):not([class*="border-r"]):not([class*="border-0"]) {

    .wa-btn { position: relative; isolation: isolate; display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px; height: var(--wa-h); min-width: var(--wa-h); padding: 0 var(--wa-px); border: 0; border-radius: var(--wa-r); background: none; color: var(--cds-text-primary); font: inherit; font-size: var(--wa-fs); line-height: var(--wa-lh); white-space: nowrap; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; transition: box-shadow var(--cds-dur-fast); }
    .wa-btn { --wa-press: .975; }
    .wa-btn, .wa-btn[data-size="md"] { --wa-h: 32px; --wa-r: 8px; --wa-fs: 14px; --wa-lh: 20px; --wa-px: 12px; }
    .wa-btn[data-size="xs"] { --wa-h: 24px; --wa-r: 6px; --wa-fs: 13px; --wa-lh: 19px; --wa-px: 8px; }
    .wa-btn[data-size="sm"] { --wa-h: 28px; --wa-r: 7px; --wa-fs: 14px; --wa-lh: 20px; --wa-px: 10px; }
    .wa-btn[data-size="lg"] { --wa-h: 40px; --wa-r: 10px; --wa-fs: 15px; --wa-lh: 22px; --wa-px: 16px; }
    .wa-btn[data-icon] { width: var(--wa-h); padding: 0; }
    .wa-squish { position: absolute; inset: 0; z-index: -1; border-radius: inherit; transform-origin: 50% center; transition: transform var(--cds-dur-slow) var(--cds-btn-spring); }
    .wa-btn:not(:disabled):active .wa-squish { transform: scale(var(--wa-press)); transition: transform var(--cds-dur-fast) ease-out; }
    .wa-paint { position: absolute; inset: 0; border-radius: inherit; background: var(--wa-bg, transparent); box-shadow: var(--wa-shadow, none); transition: background-color var(--cds-dur-fast) ease-out, box-shadow var(--cds-dur-fast) ease-out, color var(--cds-dur-fast) ease-out; }
    .wa-btn:hover .wa-paint { background: var(--wa-bg-hover, var(--wa-bg, transparent)); }
    .wa-btn:focus-visible .wa-paint { box-shadow: var(--cds-focus-shadow); }
    .wa-btn[data-variant="primary"] { --wa-bg: var(--cds-fill-primary); --wa-bg-hover: var(--cds-fill-primary-hover); color: var(--cds-on-primary); font-weight: 500; }
    .wa-btn[data-variant="secondary"] { --wa-bg: var(--cds-fill-secondary); --wa-bg-hover: var(--cds-fill-secondary-hover); --wa-shadow: inset 0 0 0 1px var(--cds-fill-secondary-ring), 0 1px 2px #0000000d; }
    .wa-btn[data-variant="ghost"] { --wa-bg-hover: var(--cds-fill-ghost-hover); }
    .wa-btn[data-variant="brand"] { --wa-bg: var(--cds-fill-brand); --wa-bg-hover: var(--cds-fill-brand-hover); color: #fff; }
    .wa-btn[data-muted] { color: var(--cds-text-muted); }
    .wa-btn[data-muted]:hover { color: var(--cds-text-primary); }
    .wa-btn[data-secondary-ink] { color: var(--cds-text-secondary); }

    /* SegmentedControl：track p 1px，thumb = 控件圆角 − 1px，内 1px 环 + 0 1px 2px */
    .wa-seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 1px; border-radius: var(--wa-seg-r, 7px); background: var(--cds-segmented-control-track); }
    .wa-seg-thumb { position: absolute; top: 1px; bottom: 1px; left: 1px; border-radius: calc(var(--wa-seg-r, 7px) - 1px); background: var(--cds-segmented-control-thumb); box-shadow: inset 0 0 0 1px var(--cds-border), 0 1px 2px #0000000d; transition: translate var(--cds-dur-base) var(--cds-ease-snap); }
    .wa-seg-opt { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: none; color: var(--cds-text-secondary); font: inherit; cursor: pointer; border-radius: calc(var(--wa-seg-r, 7px) - 2px); }
    .wa-seg-opt[aria-checked="true"] { color: var(--cds-text-primary); }

    /* Composer：0 .25rem 1.25rem black 3.5% / 7.5% + 双环（浅色外环 1px · 深色内环 1px） */
    .wa-composer {
      position: relative; padding: 8px; border-radius: .875rem; background: var(--cds-surface-3);
      box-shadow: 0 .25rem 1.25rem color-mix(in srgb, #000 3.5%, transparent), inset 0 0 0 var(--cds-ring-inner) var(--cds-ring-color), 0 0 0 var(--cds-ring-outer) var(--cds-ring-color);
    }
    .wa-composer:hover, .wa-composer[data-force="hover"] { box-shadow: 0 .25rem 1.25rem color-mix(in srgb, #000 3.5%, transparent), inset 0 0 0 var(--cds-ring-inner) var(--cds-border-strong), 0 0 0 var(--cds-ring-outer) var(--cds-border-strong); }
    .wa-composer:focus-within, .wa-composer[data-force="focus"] { box-shadow: 0 .25rem 1.25rem color-mix(in srgb, #000 7.5%, transparent), inset 0 0 0 var(--cds-ring-inner) var(--cds-border-strong), 0 0 0 var(--cds-ring-outer) var(--cds-border-strong); }
    .wa-composer[data-density="compact"] { border-radius: .75rem; }
    .wa-editor { display: block; width: 100%; resize: none; border: 0; outline: none; background: transparent; color: var(--cds-text-primary); font: inherit; font-size: 15px; line-height: 21px; padding: 5.5px 0 5.5px 8px; }
    .wa-editor::placeholder { color: var(--cds-text-muted); opacity: 1; }
    .wa-stack { display: grid; }
    .wa-stack > * { grid-area: 1 / 1; opacity: 0; pointer-events: none; transition: opacity var(--cds-dur-fast) ease-out; }
    .wa-stack > [data-on] { opacity: 1; pointer-events: auto; }
    .wa-chin { display: grid; grid-template-rows: 0fr; opacity: 0; margin-inline: -8px; transition: grid-template-rows 280ms cubic-bezier(.4, 0, .2, 1), opacity 280ms cubic-bezier(.4, 0, .2, 1); }
    .wa-chin[data-open] { grid-template-rows: 1fr; opacity: 1; }
    .wa-chin > div { min-height: 0; overflow: hidden; }

    /* Menu：radius = --cds-radius 8 + --cds-menu-gutter 4 = 12，padding 4，ring + shadow-popover */
    .wa-menu { width: max-content; padding: 4px; border-radius: 12px; background: var(--cds-surface-3); box-shadow: 0 0 0 1px var(--cds-border), var(--cds-shadow-popover); color: var(--cds-text-primary); }
    .wa-mi { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 6px 10px; border-radius: 8px; font-size: 14px; line-height: 20px; cursor: default; user-select: none; }
    .wa-mi:hover, .wa-mi[data-highlighted] { background: var(--cds-alpha-1); }
    .wa-mi-desc { display: block; font-size: 13px; line-height: 17px; color: var(--cds-text-muted); }
    .wa-sep { height: 1px; margin: 4px 10px; background: var(--cds-border); }
    .wa-badge { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 18px; padding: 0 6px; border-radius: 4.5px; background: var(--cds-alpha-1); color: var(--cds-text-secondary); font-size: 11px; line-height: 1; font-weight: 500; }
    .wa-badge[data-size="2xs"] { height: 16px; padding: 0 4px; border-radius: 4px; font-size: 10px; }
    .wa-badge[data-tone="warning"] { background: color-mix(in srgb, var(--cds-bg-warning) 35%, transparent); color: var(--cds-text-warning); }
    .wa-kbd { font: inherit; font-size: 12px; color: var(--cds-text-muted); }

    /* Tooltip：#0b0b0b，13/18，r 6，p 3px 8px，min-h 24，opacity + scale(.98) 120ms ease-snap，距触发器约 5.5px */
    .wa-tip-host { position: relative; display: inline-flex; }
    .wa-tip { position: absolute; top: calc(100% + 5.5px); left: 50%; translate: -50% 0; z-index: 50; display: flex; align-items: center; gap: 8px; min-height: 24px; padding: 3px 8px; border-radius: 6px; background: var(--cds-tooltip-bg); color: var(--cds-tooltip-fg); font-size: 13px; line-height: 18px; white-space: nowrap; box-shadow: var(--cds-shadow-sm); opacity: 0; scale: .98; pointer-events: none; transition: opacity var(--cds-dur-snap) var(--cds-ease-snap), scale var(--cds-dur-snap) var(--cds-ease-snap); }
    .wa-tip-host:hover > .wa-tip, .wa-tip-host:focus-within > .wa-tip { opacity: 1; scale: 1; }

    /* Sidebar（web · comfortable） */
    .wa-sidebar { position: relative; display: flex; flex-direction: column; width: 288px; flex: none; background: var(--df-web-sidebar-bg); border-right: .5px solid var(--cds-border); color: var(--cds-text-primary); font-size: 14px; line-height: 21px; }
    .wa-reveal { opacity: .7; transition: opacity .12s cubic-bezier(.32, .72, 0, 1); }
    .wa-sidebar:hover .wa-reveal { opacity: 1; }
    .wa-row { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 2px; border-radius: 8px; color: var(--cds-text-secondary); cursor: pointer; user-select: none; }
    .wa-row:hover { background: var(--df-hover); }
    .wa-row[data-selected] { background: var(--df-selected); }
    .wa-row-lead { display: grid; place-items: center; width: 28px; height: 28px; flex: none; }
    .wa-row-label { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; }
    .wa-row[data-iconless] .wa-row-label { padding-inline-start: 4px; }
    .wa-row-label[data-fade] { -webkit-mask-image: linear-gradient(to left, transparent, #000 24px); mask-image: linear-gradient(to left, transparent, #000 24px); }
    .wa-row-act, .wa-row-hint { opacity: 0; transition: opacity var(--cds-dur-fast) ease-out; }
    .wa-row:hover .wa-row-act, .wa-row:hover .wa-row-hint, .wa-row:focus-within .wa-row-act { opacity: 1; }
    .wa-row-act { position: absolute; inset-inline-end: 4px; top: 4px; }
    .wa-new-circle { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: var(--df-new-circle-bg); }
    .wa-search { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: var(--cds-fill-field); box-shadow: inset 0 0 0 .5px var(--cds-alpha-2), 0 1px 2px #0000000d; color: var(--cds-text-muted); font: inherit; font-size: 14px; cursor: pointer; }
    .wa-search:hover { background: var(--cds-alpha-1); box-shadow: inset 0 0 0 1px var(--cds-alpha-2); }
    .wa-search .wa-kbd { margin-inline-start: auto; opacity: 0; transition: opacity var(--cds-dur-fast) ease-out; }
    .wa-search:hover .wa-kbd { opacity: 1; }
    .wa-resize { position: absolute; top: 0; bottom: 0; right: -6px; width: 12px; display: grid; place-items: center; cursor: col-resize; }
    .wa-resize > i { width: 3px; height: 48px; border-radius: 999px; background: var(--cds-text-muted); opacity: 0; transition: opacity .2s; }
    .wa-resize:hover > i { opacity: 1; }
    .wa-pulse-mask { -webkit-mask: radial-gradient(circle at calc(100% - 1px) 1px, transparent 4.5px, #000 5px); mask: radial-gradient(circle at calc(100% - 1px) 1px, transparent 4.5px, #000 5px); }
    .wa-pulse-dot { position: absolute; top: -2px; right: -2px; width: 6px; height: 6px; border-radius: 999px; background: var(--cds-fill-accent); animation: wa-dot-blink 1.2s ease-in-out infinite; }

    /* Jump-to-latest：size-9 · p-1 · !rounded-full · border-.5 · bg-000/80 + backdrop-blur · shadow-md → hover lg · 只过渡 opacity / border-color 200ms */
    .wa-jump { position: absolute; left: 50%; bottom: 20px; translate: -50% 0; z-index: 1; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 4px; overflow: hidden; border: .5px solid var(--cds-border); border-radius: 999px; background: color-mix(in srgb, var(--cds-surface-3) 80%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: var(--cds-shadow-md); color: var(--cds-text-primary); cursor: pointer; transition: opacity .2s, border-color .2s; }
    .wa-jump::before { content: ""; position: absolute; inset: 0; transition: background-color .2s; }
    .wa-jump:hover { box-shadow: var(--cds-shadow-lg); }
    .wa-jump:hover::before { background: var(--cds-fill-ghost-hover); }
    .wa-jump > svg { position: relative; mix-blend-mode: luminosity; }

    /* 登录页字段与链接 */
    .wa-input { width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--cds-fill-field); box-shadow: inset 0 0 0 1px var(--cds-fill-field-ring); color: var(--cds-text-primary); font: inherit; font-size: 15px; outline: none; transition: box-shadow var(--cds-dur-fast) ease-out; }
    .wa-input::placeholder { color: var(--cds-text-muted); }
    .wa-input:focus { box-shadow: var(--cds-focus-shadow); }
    .wa-link { color: var(--cds-text-accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; }
    .wa-acc { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 40px; padding: 9px 12px; border: 0; border-radius: 8px; background: none; color: var(--cds-text-primary); font: inherit; font-size: 15px; font-weight: 500; text-align: start; cursor: pointer; }
    .wa-acc:hover { background: var(--cds-fill-ghost-hover); }
    .wa-acc > svg { transition: rotate var(--cds-dur-base) var(--cds-ease-snap); }
    .wa-acc[aria-expanded="true"] > svg { rotate: 90deg; }

    /* Variable icon axis（--cds-anim 0 → 100，.3s overshoot）：用宽度条替代字体 "ANIM" 轴 */
    @property --wa-anim { syntax: "<number>"; inherits: false; initial-value: 0; }
    .wa-anim-bar { --wa-anim: 0; width: calc(var(--wa-anim) * 1%); transition: --wa-anim .3s cubic-bezier(.34, 1.3, .64, 1); }
    .wa-anim-host:hover .wa-anim-bar { --wa-anim: 100; }

    /* 窗口顶部示意（W1 三种宿主并排、W15 覆盖层与缩放）：Windows titleBarOverlay 图标色与无痕反色（桌面主进程 RYn() 原值）；斜纹标出 app-region: drag */
    .wa-root { --wa-caption-ink: #3d3d3a; --wa-incog-bg: #141412; --wa-incog-ink: #fff; }
    .dark .wa-root { --wa-caption-ink: #c2c0b6; --wa-incog-bg: #f9f8f4; --wa-incog-ink: #000; }
    .wa-drag { background-image: repeating-linear-gradient(135deg, color-mix(in srgb, var(--cds-fill-accent) 14%, transparent) 0 6px, transparent 6px 12px); }
    .wa-drag .wa-nodrag { border-radius: 8px; background: var(--wa-nodrag-bg, var(--cds-page-bg)); }

    /* W13 Code 会话族谱与会话栏：.df-family:after 的「└」引导线与描述行（ion-dist shared-styles-Bl9zqrv-.css 原值），rail 卡片（c73f45bc3） */
    .wa-code { --wa-warn-ink: var(--cds-text-warning); --wa-row-h: 28px; --wa-row-px: 2px; --wa-iconless-pad: 8px; --wa-gap: 2px; }
    .dark .wa-code { --wa-warn-ink: var(--cds-bg-warning); }
    .wa-code-list { display: flex; flex-direction: column; gap: var(--wa-gap); }
    .wa-crow { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px; width: 100%; min-height: var(--wa-row-h); padding-inline: calc(var(--wa-row-px) + var(--wa-iconless-pad) + var(--wa-indent, 0px)) 8px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 13px; line-height: 20px; text-align: start; color: var(--cds-text-secondary); cursor: pointer; }
    .wa-crow:hover { background: var(--df-hover); }
    .wa-crow[data-selected] { background: var(--df-selected); color: var(--cds-text-primary); }
    .wa-crow[data-described] { padding-block: 5px 7px; row-gap: 4px; }
    .wa-crow-meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; min-width: 0; padding-inline-end: 12px; overflow: clip; white-space: nowrap; font-size: 12px; line-height: 16px; color: var(--cds-text-muted); -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 12px), #0000); mask-image: linear-gradient(90deg, #000 calc(100% - 12px), #0000); }
    .wa-crow-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--cds-alpha-4); }
    .wa-crow-dot[data-state="blocked"] { background: var(--chart-categorical-4); }
    .wa-crow-dot[data-state="running"] { background: var(--cds-fill-accent); animation: wa-dot-blink 1.2s ease-in-out infinite; }
    .wa-family { position: relative; display: flex; flex-direction: column; gap: var(--wa-gap); --wa-indent: 20px; }
    .wa-family::after { content: ""; position: absolute; pointer-events: none; top: 4px; bottom: calc(var(--wa-row-h) / 2 + var(--wa-gap)); inset-inline-start: calc(var(--wa-row-px) + var(--wa-iconless-pad) + 4px); width: 10px; border-inline-start: 1px solid var(--cds-border-strong); border-bottom: 1px solid var(--cds-border-strong); border-end-start-radius: 6px; }
    .wa-family:has(> [data-described]:last-child)::after { bottom: calc(35px + var(--wa-gap)); }
    .wa-rail { display: flex; flex-direction: column; gap: 10px; padding: 1px; }
    .wa-rail[data-flat] { gap: 0; }
    .wa-rail-card { border-radius: 10px; background: var(--cds-surface-2); box-shadow: inset 0 0 0 var(--cds-ring-inner) var(--cds-ring-color), 0 0 0 var(--cds-ring-outer) var(--cds-ring-color); }
    .wa-rail[data-flat] .wa-rail-card { border-radius: 0; background: transparent; box-shadow: none; }
    .wa-rail-head { position: relative; display: flex; align-items: center; padding: 0 12px; }
    .wa-rail-trigger { display: flex; flex: 1; min-width: 0; align-items: center; gap: 4px; height: 36px; border: 0; background: none; font: inherit; font-size: 13px; color: var(--cds-text-secondary); cursor: pointer; }
    .wa-rail-caret { display: flex; color: var(--cds-text-muted); transition: rotate var(--cds-dur-snap) var(--cds-ease-snap); }
    .wa-rail-caret[data-open] { rotate: 90deg; }
    .wa-rail-summary { display: flex; align-items: center; gap: 6px; min-width: 0; margin-inline-start: auto; padding-inline-start: 8px; overflow: hidden; white-space: nowrap; font-size: 12px; color: var(--cds-text-muted); transition: opacity var(--cds-dur-snap) var(--cds-ease-snap); }
    .wa-rail-grip { position: absolute; inset-block: 0; inset-inline-end: 8px; display: flex; align-items: center; color: var(--cds-text-muted); opacity: 0; cursor: grab; transition: opacity var(--cds-dur-snap) var(--cds-ease-snap); }
    .wa-rail-head:hover .wa-rail-grip { opacity: 1; }
    .wa-rail-head:hover .wa-rail-summary { opacity: 0; }
    .wa-rail-body { display: flex; flex-direction: column; gap: 2px; padding: 0 12px 12px; font-size: 13px; }
    .wa-rail-row { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 28px; color: var(--cds-text-secondary); }
    .wa-rail-row > svg { color: var(--cds-text-muted); }
    .wa-meter { position: relative; flex: none; width: 24px; height: 4px; overflow: hidden; border-radius: 999px; background: var(--cds-alpha-2); }
    .wa-meter > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--cds-text-secondary); }
    .wa-switch { position: relative; flex: none; width: 26px; height: 16px; border: 0; border-radius: 999px; background: var(--cds-alpha-3); cursor: pointer; transition: background var(--cds-dur-snap) var(--cds-ease-snap); }
    .wa-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 999px; background: #fff; box-shadow: var(--cds-shadow-sm); transition: translate var(--cds-dur-snap) var(--cds-ease-snap); }
    .wa-switch[aria-checked="true"] { background: var(--cds-fill-accent); }
    .wa-switch[aria-checked="true"]::after { translate: 10px 0; }

    /* W14 Code 对话与输入：默认版状态行（c96d752d0 code-working-line：h-5 · gap 16 · footnote 紧凑档 12/15）与 epitaxy-thinking-shimmer（内联 CSS cd4c7d572 原文），
       Step 版 TurnStatus（c734f318c：body 紧凑档 13/19 · gap-xs 6 · 控件高 24）与 ShimmerText（shared-frame pj / dj），排队条（cf74bc599） */
    @keyframes wa-epitaxy-thinking-shimmer { 0%, 100% { opacity: 1; } 50% { opacity: .75; } }
    .wa-think-pulse { will-change: opacity; animation: 2s ease-in-out 3s infinite wa-epitaxy-thinking-shimmer; }
    @keyframes wa-shimmer-text-shine { 0%, 15% { background-position: 83.333% 0; animation-timing-function: cubic-bezier(.714, .121, .211, .888); } 85%, 100% { background-position: 16.667% 0; } }
    .wa-shimmer-text { --wa-shine: var(--cds-text-secondary); background-image: linear-gradient(120deg, var(--wa-shine) 37.5%, color-mix(in srgb, var(--wa-shine) 30%, white) 50%, var(--wa-shine) 62.5%); background-size: 400% 100%; background-position: 83.333% 0; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: 3s linear infinite wa-shimmer-text-shine; }
    .dark .wa-shimmer-text { --wa-shine: var(--cds-text-muted); }
    .wa-work-line { display: flex; align-items: center; gap: 16px; height: 20px; }
    .wa-work-text { display: flex; align-items: center; min-width: 0; white-space: nowrap; font-size: 12px; line-height: 15px; color: var(--cds-text-secondary); font-variant-numeric: tabular-nums; }
    .wa-work-text .wa-dot { padding-inline: 4px; }
    .wa-work-text .wa-label { min-width: 3ch; overflow: hidden; text-overflow: ellipsis; }
    .wa-turn { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 24px; white-space: nowrap; font-size: 13px; line-height: 19px; color: var(--cds-text-secondary); font-variant-numeric: tabular-nums; }
    .wa-clay { position: relative; display: flex; flex: none; align-items: center; justify-content: center; width: 20px; height: 20px; color: var(--cds-clay); }

    // ==========================================================================
    // Component Showcase Card Shell (With Exact Radii and Padding)
    // ==========================================================================
    function ComponentShowcase({ title, tag, code, description, children, className = "" }) {
      const [showCode, setShowCode] = useState(false);
      const [copied, setCopied] = useState(false);

      const copySnippet = () => {
        if (!code) return;
        navigator.clipboard.writeText(code);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className={`rounded-xl border border-neutral-200/90 dark:border-neutral-800 bg-white dark:bg-[#1a1a19] shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden flex flex-col ${className}`}>
          {/* Card Header */}
          <div className="px-5 py-3 border-b border-neutral-100 dark:border-neutral-800/80 bg-neutral-50/50 dark:bg-neutral-900/40 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <h3 className="text-sm font-semibold text-neutral-900 dark:text-neutral-100 tracking-tight">{title}</h3>
              {tag && (
                <code className="text-[10px] font-mono px-1.5 py-0.5 rounded-md bg-neutral-200/60 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-400">
                  {tag}
                </code>
              )}
            </div>
            {code && (
              <div className="flex items-center gap-1.5">
                <button
                  onClick={copySnippet}
                  className="px-2 py-1 rounded-md text-[11px] font-mono text-neutral-500 hover:text-neutral-900 dark:hover:text-neutral-200 transition-colors flex items-center gap-1"
                  title="复制代码"
                >
                  <Icon name={copied ? "check" : "copy"} size="xs" className={copied ? "text-green-500" : ""} />
                  <span>{copied ? "Copied" : "Copy"}</span>
                </button>
                <button
                  onClick={() => setShowCode(!showCode)}
                  className={`px-2 py-1 rounded-md text-[11px] font-mono transition-colors ${showCode ? "bg-neutral-200 dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100" : "text-neutral-500 hover:text-neutral-800 dark:hover:text-neutral-300"}`}
                >
                  Code
                </button>
              </div>
            )}
          </div>

          {/* Description */}
          {description && (
            <div className="px-5 pt-3 pb-1 text-xs text-neutral-500 dark:text-neutral-400 leading-relaxed">
              {description}
            </div>
          )}

          {/* Canvas Area */}
          <div className="p-5 flex-1 flex flex-col justify-center">
            {children}
          </div>

          {/* Collapsible Code Drawer */}
          {showCode && code && (
            <div className="border-t border-neutral-100 dark:border-neutral-800 bg-[#0d0d0c] text-neutral-300 p-4 font-mono text-xs overflow-x-auto leading-relaxed">
              <pre>{code}</pre>
            </div>
          )}
        </div>
      );
    }

    // ==========================================================================
    // 7. SECTION: Motion, Status & Shimmer
    // ==========================================================================
    function MotionSection() {
      const calcSpring = (k, c, m, t) => {
        const w0 = Math.sqrt(k / m);
        const zeta = c / (2 * Math.sqrt(m * k));
        if (zeta < 1) {
          const wd = w0 * Math.sqrt(1 - zeta * zeta);
          return 1 - Math.exp(-zeta * w0 * t) * (Math.cos(wd * t) + (zeta / Math.sqrt(1 - zeta * zeta)) * Math.sin(wd * t));
        }
        return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
      };

      const [positions, setPositions] = useState({ b: 0, c: 0, f: 0, d: 0 });
      const [isRacing, setIsRacing] = useState(false);

      const runSpringRace = () => {
        setIsRacing(true);
        const start = performance.now();
        const duration = 1.3;

        const tick = (now) => {
          const t = (now - start) / 1000;
          setPositions({
            b: calcSpring(600, 30, 1, t),
            c: calcSpring(320, 28, 1, t),
            f: calcSpring(380, 18, 1, t),
            d: calcSpring(1200, 80, 0.1, t),
          });
          if (t < duration) {
            requestAnimationFrame(tick);
          } else {
            setPositions({ b: 1, c: 1, f: 1, d: 1 });
            setIsRacing(false);
          }
        };
        requestAnimationFrame(tick);
      };

      return (
        <div className="space-y-6">
          {/* 7.1 状态指示灯与呼吸动效 */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

                <span className="size-3.5 rounded-full bg-clay shadow-sm" style={{ animation: "dframe-clay-breathe 2.4s infinite ease-in-out" }} />

            </ComponentShowcase>

              title="活动脉冲指示灯"

                <span className="size-3 rounded-full bg-emerald-500" style={{ animation: "dframe-dot-pulse 1.2s infinite ease-in-out" }} />
                <span className="text-xs font-mono text-neutral-500">dframe-dot-pulse</span>
              </div>
            </ComponentShowcase>

            <ComponentShowcase
              title="思考波浪跳动 Quiet Dots"

                <div className="inline-flex items-center gap-[5px]">
                  <span className="size-2 rounded-full bg-clay" style={{ animation: "1.9s infinite timeline-quiet-dot", animationDelay: "0s" }} />
                  <span className="size-2 rounded-full bg-clay" style={{ animation: "1.9s infinite timeline-quiet-dot", animationDelay: "0.15s" }} />

                </div>
              </div>
            </ComponentShowcase>
          </div>

          {/* 7.2 骨架屏高级倾斜扫光 */}

            title="高级倾斜骨架屏 (Skeleton Shimmer)"

      const stroke = 4;
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const color = beat === 0 ? "var(--chart-categorical-1)" : beat === 1 ? "var(--chart-categorical-4)" : "var(--chart-categorical-8)";
      return (
        <div
          key={entranceKey}
          className="urm"
          data-entrance="draw"
          data-beat={beat || undefined}
          style={{ "--urm-size": `${size}px`, "--urm-color": color, "--ring-c": c, "--urm-travel": `${value * 3.6}deg` }}
        >
          <div className="urm__glow" />
          <div className="urm__hover">
            <div className="urm__beat-glow" />
            <div className="urm__beat">
              <div key={shimmerKey} className="urm__breath" data-shimmer={shimmerKey ? "" : undefined} style={{ display: "grid" }}>
                <svg width={size} height={size} style={{ transform: "rotate(-90deg)", gridArea: "1/1" }}>
                  <circle data-ring-track cx={size / 2} cy={size / 2} r={r} fill="none" strokeWidth={stroke} stroke="var(--cds-alpha-2)" />
                  <circle data-ring-arc cx={size / 2} cy={size / 2} r={r} fill="none" strokeWidth={stroke} strokeLinecap="round" stroke={color} strokeDasharray={c} strokeDashoffset={c * (1 - value / 100)} />
                </svg>
                <svg className="urm__comet" width={size} height={size} style={{ gridArea: "1/1" }}>
                  <circle cx={size / 2} cy={size / 2} r={r} fill="none" strokeWidth={stroke} strokeLinecap="round" strokeDasharray={`${c * 0.08} ${c}`} />
                </svg>
                <span className="font-mono text-[11px] font-semibold tabular-nums text-neutral-700 dark:text-neutral-200" style={{ gridArea: "1/1" }}>{value}%</span>
              </div>
            </div>
          </div>

    // --------------------------------------------------------------------------
    // W13 Code 会话族谱与会话栏：REA 静态分析 ion-dist（shared-11 / 20 / 21 / 22 / 78、c73f45bc3、c96d752d0、c2d611398）
    // --------------------------------------------------------------------------
    // 会话标题、分支、路径、汇报内容均为占位
    const WA_CODE_ROWS = [
      { id: "a", title: "重构设置页", at: 5 },
      { id: "b", title: "重构设置页 (fork)", head: "a", spawner: "a", kind: "fork", at: 9 },

    const waPill = (on) => "h-7 px-2.5 rounded-md text-[11px] font-mono transition-colors " + (on ? "bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900" : "bg-neutral-100 dark:bg-neutral-800 text-neutral-600 dark:text-neutral-300 hover:bg-neutral-200 dark:hover:bg-neutral-700");

    // shared-21 rz() + az()：子会话一律挂到家族根（sideParentId），再按直接派生者（sideSpawnerId）深度优先排，最深 32 层。
    // 按最近活动排序时家族落在最近活跃成员的位置（UR.recency = "best-member"），按名称或创建时间排序时落在根的位置（"parent"）。
    function waCodeTree(rows, sort, nest) {
      const cmp = sort === "alpha" ? (x, y) => x.title.localeCompare(y.title, "zh") : (x, y) => y.at - x.at;
      const sorted = [...rows].sort(cmp);
      const byId = new Map(rows.map((r) => [r.id, r]));
      const headOf = new Map(nest ? sorted.filter((r) => r.head && r.head !== r.id && byId.has(r.head)).map((r) => [r.id, r.head]) : []);
      const heads = new Set(headOf.values());
      const kids = new Map();
      for (const r of sorted) {
        const h = headOf.get(r.id);
        if (h === undefined) continue;
        const key = r.spawner !== undefined && headOf.get(r.spawner) === h ? r.spawner : h;
        kids.set(key, [...(kids.get(key) ?? []), r]);
      }
      const out = [];
      const seen = new Set();
      const walk = (id, depth) => {
        if (depth > 32) return;
        for (const k of kids.get(id) ?? []) {
          if (seen.has(k.id)) continue;
          seen.add(k.id);
          out.push({ row: k, place: "nested" });
          walk(k.id, depth + 1);
        }
      };
      for (const r of sorted) {
        const h = headOf.get(r.id);
        if (h !== undefined && sort === "alpha") continue;
        const id = h ?? r.id;
        if (seen.has(id)) continue;
        seen.add(id);
        out.push({ row: byId.get(id), place: heads.has(id) ? "head" : "flat" });
        walk(id, 0);
      }
      return out;
    }

    // 侧栏与会话栏用到的几个小图标（自绘示意，不是 Anthropicons 原形）

          {k === "folder" && <path d="M2 5.5A1.5 1.5 0 0 1 3.5 4H6l1.5 1.5h5A1.5 1.5 0 0 1 14 7v4.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" />}
          {k === "laptop" && <><rect x="3" y="3.5" width="10" height="7" rx="1" /><path d="M1.5 12.5h13" /></>}

          {k === "grip" && [5, 8, 11].flatMap((y) => [6, 10].map((x) => <circle key={`${x}-${y}`} cx={x} cy={y} r=".8" fill="currentColor" stroke="none" />))}
          {k === "x" && <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" />}
          {k === "edit" && <path d="M10.5 3l2.5 2.5L6 12.5H3.5V10z" />}
          {k === "return" && <path d="M12.5 3.5V7a2 2 0 0 1-2 2H4m2.5-2.5L4 9l2.5 2.5" />}
        </svg>
      );

    // shared-21 Eq() 的描述行走 shared-20 IE() / BE()：被阻塞时「已屏蔽」+ 待回答的问题，否则唯一分支（dD()）

    const WA_CODE_SIDES = [["web", "网页 · Remote Control 镜像"], ["desktop", "桌面 · 本地会话"]];

    // 并排示意的一列：宿主决定能不能算出家族（网页端 nest = false，全部平铺）
    function WaCodeFamilyList({ host, sort, blocked }) {

      const byId = new Map(WA_CODE_ROWS.map((r) => [r.id, r]));

    // --------------------------------------------------------------------------

    // --------------------------------------------------------------------------
    // 界面文字是 en-US defaultMessage 原文（安装包没有 zh-CN 语言包）；对话内容和数值为占位
    const WA_THINK_STEPS = [[60, "Almost done thinking…"], [45, "Thinking some more…"], [30, "Thinking more…"], [15, "Still thinking…"], [0, "Thinking…"]];
    const WA_PHASE = { connecting: "Connecting…", sending: "Sending…", starting: "Starting session…", preparing: "Preparing…", model: "Waiting for Claude…", tools: "Running tools…" };
    const waThinkLabel = (s) => WA_THINK_STEPS.find(([t]) => s >= t)[1]; // c96d752d0 Net()
    const waBucket = (s) => [60, 45, 30, 15, 2].find((t) => s >= t) ?? 0; // p8()：状态行只在跨档时重绘
    const waClock = (s) => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h ? `${h}h ${m}m ${x}s` : m ? `${m}m ${x}s` : `${x}s`; }; // shared-frame Ij()，en-US narrow
    const waTokenText = (n) => (n === 1 ? "1 token" : `${n >= 1000 ? `${(n / 1000).toFixed(1)}k` : n} tokens`); // y8() + shared-8 AV()：千位保留 .0

    // c96d752d0 ITe()：思考结束后先补足 2s 最短显示（PTe），再显示 2s「Thought for Ns」（FTe），然后消失
    function waThinking(now, start, end) {
      if (now < start) return null;
      if (now < end) return { kind: "active", open: true };
      const dur = end - start, hold = end + Math.max(0, 2 - dur);
      if (now < hold) return { kind: "active", open: false };
      return now < hold + 2 ? { kind: "done", seconds: Math.max(1, Math.round(dur)) } : null;
    }

    // 一轮示意：0–1s 发送，随后等模型，第 3s 起思考 dur 秒，思考结束后跑 8s 工具，再输出正文；token 增速为占位
    function waTurnAt(t, start, dur) {
      const end = start + dur;
      const thinking = waThinking(t, start, end);
      const waiting = t < 1 ? "sending" : t < start ? "model" : t >= end && t < end + 8 ? "tools" : null;
      const tokens = t < start ? 0 : Math.round((Math.min(t, end) - start) * 42 + Math.max(0, t - end - 8) * 31);
      const sec = Math.floor(t), bucket = waBucket(sec);
      const think = thinking === null ? null : thinking.kind === "active" ? waThinkLabel(bucket) : `Thought for ${thinking.seconds}s`;
      const label = think ?? (waiting === null ? null : WA_PHASE[waiting]);
      return {
        thinking, waiting, tokens, sec, bucket, label,
        source: think !== null ? (thinking.kind === "active" ? "Net()，按本轮已用时间" : "ITe() done") : label !== null ? "h8()，等待阶段" : null,
        pulse: label !== null && thinking?.kind !== "done",
        clock: bucket >= 2,
        showTokens: bucket >= 2 && tokens > 0,
        activity: waiting === "tools" ? "read" : "think",
      };
    }

    // c8677db5f 帧表：48px 一帧，33.3333ms/帧（30fps）；ALIASES 里 sphere 用 default 的图，compose 用 quill 的图
    const WA_CLAY = {
      think: { in: 16, loop: 110, out: 15, seams: [54], rest: 95 },
      read: { in: 21, loop: 60, out: 19, rest: 44 },
      search: { in: 16, loop: 20, out: 14, rest: 4 },
      write: { in: 31, loop: 60, out: 14, rest: 36 },
      compose: { in: 16, loop: 62, out: 12, rest: 49 },
      code: { in: 16, loop: 75, out: 9, seams: [18, 37, 56], rest: 74 },
      default: { in: 16, loop: 40, out: 14, rest: 38 },
      blocked: { in: 16, loop: 30, out: 16, rest: 0 },
    };
    const waClayLen = (st) => (st.kind === "grow" ? 10 : st.kind === "tail" ? Math.min(20, WA_CLAY[st.body].loop) : WA_CLAY[st.body][st.kind]);

    // cc39db724 fe()：grow → in → loop →（目标变了）out → in(新目标)；tail 是循环的最后 20 帧
    function waClayNext(st, target) {
      if (st.kind === "grow" || st.kind === "out") return { kind: "in", body: target };
      if (st.kind === "in") return { kind: "loop", body: st.body };
      return st.body === target ? { kind: "loop", body: st.body } : { kind: "out", body: st.body };
    }

    // 每帧推进一次。循环中途换目标：有接缝就在下一个接缝切出；涉及 blocked / default 时先满 2s，剩余超过 1.5s（45 帧）就跳到 tail
    function waClayTick(m, target) {
      const len = waClayLen(m.st);
      const frame = m.frame + 1, ms = m.ms + 1000 / 30;
      let next = null;
      if (m.st.kind === "loop" && m.st.body !== target) {
        const slow = [target, m.st.body].some((b) => b === "blocked" || b === "default");
        if (!slow && WA_CLAY[m.st.body].seams?.includes(frame)) next = { kind: "out", body: m.st.body };
        else if (slow && ms >= 2000 && len - frame > 45) next = { kind: "tail", body: m.st.body };
      }
      if (next === null && frame < len) return { ...m, frame, ms };
      next ??= waClayNext(m.st, target);
      const again = next.kind === "loop" && m.st.kind === "loop";
      return { st: next, frame: 0, ms: next.kind === "loop" || next.kind === "out" ? ms : 0, log: again ? m.log : [...m.log.slice(-5), `${next.body}.${next.kind}`] };
    }

    // 自绘示意：形体是简化图形，不是原雪碧图；帧数、帧率、接缝和切换规则按原值运行。still 时直接停在目标形体的 rest 帧
    function WaClayMark({ activity = "think", blocked = false, size = 20, still = false, info = false }) {
      const target = blocked ? "blocked" : activity;
      const [m, setM] = useState({ st: { kind: "grow" }, frame: 0, ms: 0, log: ["grow"] });
      const [reduce, setReduce] = useState(false);
      const want = useRef(target);
      want.current = target;
      useEffect(() => {
        if (still) return undefined;
        if (window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches) { setReduce(true); return undefined; }
        const id = setInterval(() => setM((x) => waClayTick(x, want.current)), 1000 / 30);
        return () => clearInterval(id);
      }, [still]);
      const rest = still || reduce;
      const st = rest ? { kind: "loop", body: target } : m.st;
      const frame = rest ? WA_CLAY[target].rest : m.frame;
      const len = waClayLen(st), p = frame / len;
      const scale = st.kind === "grow" ? .2 + .3 * p : st.kind === "in" ? .5 + .5 * p : st.kind === "out" ? 1 - .5 * p : 1 + .06 * Math.sin((2 * Math.PI * frame) / 20);
      const body = st.kind === "grow" ? "grow" : st.body;
      const glyph = {
        grow: <circle cx="8" cy="8" r="3" fill="currentColor" stroke="none" />,
        think: <g transform={`rotate(${frame * 4} 8 8)`} fill="currentColor" stroke="none"><circle cx="8" cy="3.5" r="1.7" /><circle cx="11.9" cy="10.25" r="1.7" /><circle cx="4.1" cy="10.25" r="1.7" /></g>,
        read: <path d={`M3 4.5h10M3 8h10M3 11.5h${4 + (frame % 20) / 4}`} />,
        search: <><circle cx="7" cy="7" r="3.5" /><path d="M9.6 9.6L13 13" /></>,
        write: <path d="M10.5 3l2.5 2.5L6 12.5H3.5V10z" />,
        compose: <path d="M13 3c-5 0-8 3.5-9 9.5M4.5 9.5H8" />,
        code: <path d="M6 4.5L2.5 8 6 11.5M10 4.5L13.5 8 10 11.5" />,
        default: <circle cx="8" cy="8" r="4.5" fill="currentColor" stroke="none" />,
        blocked: <><circle cx="8" cy="8" r="5.5" /><path d="M8 5v3.5M8 11h.01" /></>,
      }[body];
      const mark = (
        <span className="wa-clay" style={size === 20 ? undefined : { width: size, height: size }} aria-hidden="true">
          <svg width={size} height={size} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{ transform: `scale(${scale})`, opacity: st.kind === "out" ? 1 - .6 * p : 1 }}>{glyph}</svg>
        </span>
      );
      if (!info) return mark;
      return (
        <div className="flex flex-col items-center gap-2">
